# 统一日志配置。
logger_name: kg_rag_agent
level: INFO
enable_console: true
enable_file: true
log_dir: outputs/logs
log_file: kg_rag_agent.log
propagate: false
format: "%(asctime)s | %(levelname)-8s | %(name)s | %(filename)s:%(lineno)d | %(message)s"
date_format: "%Y-%m-%d %H:%M:%S"
max_bytes: 10485760
backup_count: 5
log_node_start: true
log_node_end: true
log_node_error: true
max_query_length: 160
max_answer_length: 300
