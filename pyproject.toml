[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "kg-rag-agent"
version = "0.1.0"
description = "A LangGraph-based knowledge-graph retrieval-augmented generation agent."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
keywords = [
    "agent",
    "knowledge-graph",
    "kg-rag",
    "langgraph",
    "llm",
    "rag",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.2",
    "networkx>=3.2",
    "openai>=1.40",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "typing-extensions>=4.8",
]

[project.optional-dependencies]
retrieval = [
    "chromadb>=0.5",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
evaluation = [
    "pandas>=2.2",
]
test = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
dev = [
    "build>=1.2",
    "httpx>=0.27",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
]
all = [
    "chromadb>=0.5",
    "fastapi>=0.110",
    "numpy>=1.26",
    "pandas>=2.2",
    "sentence-transformers>=3.0",
    "uvicorn[standard]>=0.27",
]

[project.scripts]
kg-rag-agent = "kg_rag_agent.main:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["kg_rag_agent*"]
exclude = [
    "tests*",
]

[tool.setuptools.package-data]
kg_rag_agent = [
    "prompts/*/*.txt",
    "prompts/**/*.txt",
]

[tool.setuptools.exclude-package-data]
"*" = [
    "__pycache__/*",
    "*.py[cod]",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
markers = [
    "unit: tests isolated from real external services",
    "smoke: minimal import and execution checks",
    "integration: tests across multiple project modules",
    "e2e: end-to-end workflow tests",
    "slow: tests that may take noticeably longer",
    "llm: tests that may use an LLM provider",
    "kg: knowledge-graph tests",
    "retrieval: vector or hybrid retrieval tests",
    "api: FastAPI endpoint tests",
    "memory: session, project, or user memory tests",
]
filterwarnings = [
    "error::DeprecationWarning:kg_rag_agent.*",
]

[tool.coverage.run]
branch = true
source = ["kg_rag_agent"]
omit = [
    "src/kg_rag_agent/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = [
    ".git",
    ".idea",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "B",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
]
ignore = [
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["kg_rag_agent"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
packages = ["kg_rag_agent"]
mypy_path = "src"
namespace_packages = false
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "langchain_core.*",
    "langgraph.*",
    "networkx.*",
    "openai.*",
    "sentence_transformers.*",
    "uvicorn.*",
]
ignore_missing_imports = true
